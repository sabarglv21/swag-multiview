<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Pusat Komando Multi-View - Cougan Family" />
    <meta name="author" content="Cougan" />
    <title>Pusat Komando Multi-View - COUGAN FAMILY</title>
    <link rel="icon" type="image/x-icon" href="assets/img/swag.png" />
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(15, 20, 31, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --live-red: #ef4444;
            --live-glow: rgba(239, 68, 68, 0.6);
        }

        * { box-sizing: border-box; }
        
        html, body {
            height: 100vh; width: 100vw; overflow: hidden; margin: 0; padding: 0;
            background-color: var(--bg-dark); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #e2e8f0;
        }

        .main-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        /* Modern Glassmorphism Top Bar */
        .top-bar-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            flex-shrink: 0; 
            height: 56px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); 
            z-index: 100;
        }

        .brand-badge {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            letter-spacing: 0.8px;
        }

        /* Dynamic Grid Layout */
        #streamDynamicGridLayout {
            display: grid !important; 
            gap: 12px !important; 
            flex-grow: 1; 
            padding: 12px !important;
            margin: 0 !important; 
            height: calc(100vh - 56px) !important; 
            width: 100vw !important;
            overflow-y: auto !important; 
            box-sizing: border-box; 
            align-content: start;
        }

        #streamDynamicGridLayout.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        #streamDynamicGridLayout.layout-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
        #streamDynamicGridLayout.layout-3, #streamDynamicGridLayout.layout-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        #streamDynamicGridLayout.layout-5, #streamDynamicGridLayout.layout-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
        #streamDynamicGridLayout.layout-7, #streamDynamicGridLayout.layout-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
        #streamDynamicGridLayout.layout-9, #streamDynamicGridLayout.layout-10 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); }
        #streamDynamicGridLayout.layout-11, #streamDynamicGridLayout.layout-12 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
        #streamDynamicGridLayout.layout-13, #streamDynamicGridLayout.layout-14, #streamDynamicGridLayout.layout-15, #streamDynamicGridLayout.layout-16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
        #streamDynamicGridLayout.layout-17, #streamDynamicGridLayout.layout-18, #streamDynamicGridLayout.layout-19, #streamDynamicGridLayout.layout-20 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); }

        .col-stream-item { width: 100% !important; height: 100% !important; min-height: 180px !important; }
        
        /* Cyber-style Video Frame Card */
        .video-monitor-frame-box {
            height: 100% !important; 
            width: 100% !important; 
            background: #000; 
            border-radius: 12px;
            overflow: hidden; 
            position: relative; 
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-monitor-frame-box:hover { 
            border-color: rgba(245, 158, 11, 0.6) !important; 
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .monitor-header-bar {
            position: relative; 
            z-index: 10; 
            background: rgba(10, 14, 23, 0.85); 
            padding: 8px 14px !important;
            font-size: 0.72rem; 
            backdrop-filter: blur(8px); 
            flex-shrink: 0; 
            border-bottom: 1px solid var(--border-color);
        }

        .monitor-action-btn {
            background: rgba(255, 255, 255, 0.08) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 6px; 
            width: 24px; 
            height: 24px; 
            display: inline-flex; 
            align-items: center;
            justify-content: center; 
            font-size: 0.8rem !important; 
            color: #94a3b8 !important; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .monitor-action-btn:hover { 
            background: var(--accent-gold) !important; 
            color: #000 !important; 
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .close-monitor-x-btn:hover { 
            background: var(--live-red) !important; 
            color: #fff !important; 
            border-color: var(--live-red) !important;
            box-shadow: 0 0 10px var(--live-glow);
        }

        .ratio-16x9 { flex-grow: 1; position: relative; width: 100% !important; height: 100% !important; }
        .ratio-16x9 iframe { position: absolute !important; top: 0; left: 0; width: 100% !important; height: 100% !important; border: 0; }

        /* Sleek Modern Modal */
        .modal-content { 
            background: rgba(15, 20, 31, 0.95); 
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); 
        }

        .search-input { 
            background-color: rgba(7, 9, 14, 0.6); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            border-radius: 10px; 
            padding: 10px 14px; 
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .search-input:focus { 
            background-color: rgba(7, 9, 14, 0.9); 
            border-color: var(--accent-gold); 
            color: #fff; 
            box-shadow: 0 0 12px var(--accent-glow); 
        }

        .member-grid-modal { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); 
            gap: 10px; 
            max-height: 55vh; 
            overflow-y: auto; 
            padding-right: 4px; 
        }

        .btn-mv-toggle {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border-color); 
            color: #94a3b8; 
            padding: 9px 12px;
            border-radius: 10px; 
            text-align: left; 
            font-size: 0.8rem; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: all 0.2s ease; 
            width: 100%; 
            cursor: pointer;
        }

        .btn-mv-toggle:hover { 
            border-color: rgba(245, 158, 11, 0.5); 
            color: #fff; 
            background: rgba(245, 158, 11, 0.08); 
        }

        .btn-active-mv { 
            border-color: #22c55e !important; 
            background: rgba(34, 197, 94, 0.12) !important; 
            color: #4ade80 !important; 
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
        }

        .indicator-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background-color: #475569; 
            display: inline-block; 
            flex-shrink: 0; 
            transition: all 0.2s ease;
        }

        .dot-live-red { 
            background-color: var(--live-red) !important; 
            box-shadow: 0 0 8px var(--live-red), 0 0 16px var(--live-red) !important;
            animation: pulseGlow 1.5s infinite !important;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }

        .btn-custom-trigger {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            color: #000;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-custom-trigger:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.5);
            transform: translateY(-1px);
        }

        .btn-refresh-cyber {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-gold);
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-refresh-cyber:hover {
            background: rgba(245, 158, 11, 0.18);
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-filter-live-only {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-filter-live-only.active {
            background: var(--live-red);
            color: #fff;
            border-color: var(--live-red);
            box-shadow: 0 0 12px var(--live-glow);
        }

        .empty-placeholder-card {
            background: rgba(15, 20, 31, 0.4);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            padding: 40px 20px;
        }

        /* Modern Toast Notification */
        .toast-container-custom {
            position: fixed;
            top: 68px;
            right: 20px;
            z-index: 1050;
            pointer-events: none;
        }

        .toast-cyber {
            background: rgba(15, 20, 31, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
            color: #fff;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toast-cyber.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }
    </style>
</head>
<body>
    
    <!-- Cyber Toast Popup -->
    <div class="toast-container-custom">
        <div class="toast-cyber" id="refreshToast">
            <i class="fas fa-sync-alt text-warning fa-spin" id="toastStatusIcon"></i>
            <div>
                <div class="fw-bold small text-warning" id="toastTitle">Mengecek Status Live...</div>
                <div class="text-white-50" style="font-size: 0.72rem;" id="toastDesc">Sedang memindai seluruh channel member</div>
            </div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="top-bar-panel d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-refresh-cyber btn-sm px-3 py-2 d-flex align-items-center gap-2" id="btnRefreshManual" onclick="manualRefreshLiveStatus()" title="Klik untuk mengecek & merefresh siapa saja member yang sedang LIVE!">
                    <i class="fas fa-sync-alt text-warning" id="refreshIcon"></i>
                    <span class="small fw-semibold" style="font-size: 0.78rem;">Refresh Status Live</span>
                </button>

                <span class="fw-bold small text-uppercase brand-badge text-warning d-flex align-items-center gap-2">
                    <i class="fas fa-satellite-dish text-warning"></i>
                    Multi-View SWAG (<span id="activeCountLabel">0</span>/<span id="totalMembersLabel">0</span>)
                </span>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm text-white-50 border-opacity-25 px-2 py-1 rounded-2" onclick="toggleAllAudio()" id="btnGlobalMute" title="Mute/Unmute Semua Audio Stream">
                    <i class="fas fa-volume-mute text-warning" id="globalMuteIcon"></i>
                </button>

                <button class="btn btn-custom-trigger btn-sm px-3 py-2" data-bs-toggle="modal" data-bs-target="#channelModal">
                    <i class="fas fa-th-large me-1"></i> Pilih Channel / POV
                </button>
            </div>
        </div>

        <div id="streamDynamicGridLayout">
            <div class="col-12 text-center my-auto" id="emptyGridPlaceholder">
                <div class="empty-placeholder-card d-inline-block px-5">
                    <i class="fas fa-border-all text-muted mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
                    <h6 class="fw-bold text-white mb-1">Multi-View SWAG</h6>
                    <p class="text-white-50 small m-0">Tidak ada monitor stream aktif. Klik tombol <b>"Pilih Channel / POV"</b> di atas.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="channelModal" tabindex="-1" aria-labelledby="channelModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary border-opacity-25 px-4">
                    <h5 class="modal-title fs-6 fw-bold text-warning d-flex align-items-center gap-2" id="channelModalLabel">
                        <i class="fas fa-users text-warning"></i> Daftar Channel Member
                    </h5>
                    <button type="button" class="btn-close btn-close-white opacity-75" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="d-flex gap-2 mb-3">
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-white-50"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control search-input" id="searchChannelInput" placeholder="Cari nama member..." onkeyup="filterChannels()">
                        </div>
                        <button class="btn-filter-live-only text-nowrap d-flex align-items-center gap-1" id="btnFilterLiveOnly" onclick="toggleLiveOnlyFilter()">
                            <i class="fas fa-broadcast-tower"></i> Hanya LIVE
                        </button>
                    </div>

                    <div class="member-grid-modal" id="memberButtonsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const couganMembersData = {
        dama:     { name: "DAMA",           channelId: "UCRpjWT4pLKSRMIHe1tDt7HA" },
        kensin:   { name: "kenshin",        channelId: "UC98yFcLYaH3GEamINY8qxPA" },
        opank21:  { name: "Opank21",        channelId: "UCvX6upG4u79fwNUDPIdYxRQ" },
        dudung:   { name: "Dudung",         channelId: "UC21jlheq1Md8BQaWrii7V6w" },
        zoe:      { name: "zoe",            channelId: "UCY06vxuyFJrv3jQ9sDGv3ng" },
        lucian:   { name: "Lucian",         channelId: "UClBSnB6IovJ_CRdxVlsUPhQ" },
        gema:     { name: "GEMA",           channelId: "UCsX8qV4bFMBr1hUx77KWcBQ" },
        senja:    { name: "Senjaa",         channelId: "UCoikWlFCynlX4BGHNM4zJ9A" },
        tea:      { name: "TayaSoe",        channelId: "UCstdCbpKxb1gG6sB8Dw2SoA" },
        aurel:    { name: "AurelPermata",   channelId: "UCZ_Tc4r3k_a96vfXCjueijQ" },
        marukawa: { name: "Marukawa",       channelId: "UCSabDeB5nHLF-U_yWH0biXA" },
        eko:      { name: "Echoo Z",        channelId: "UCVKPeHmHaL1JVhNtDLp_7Kw" },
        jin:      { name: "Sungjin",        channelId: "UC0AtYLyIoi0WWdJh39LMCWw" },
        son:      { name: "Son",            channelId: "UCehXGZb-QhXJC5nNiaZApYQ" },
        jon:      { name: "Gogon",          channelId: "UC9HzDqyim6jLQWhAPEa7Ftw" },
        arzey:    { name: "Arzey",          channelId: "UC_XwmfA14Vr4ylVNSgiVETg" },
        dapip:    { name: "D4vid",          channelId: "UCfhsNj2dfwOZWF1f3DScuzw" },
        ale:      { name: "Reyksi",         channelId: "UCor8XoxtT_UcuDoQc9I2h4g" },
        mako:     { name: "Makoto Mitsumi", channelId: "UCuRG7lrHvyQbZynQ_GF4wgQ" },
        karael:   { name: "Karael",         channelId: "UC2WV9JpMH-sGap44MjPKEhw" },
        arlik:    { name: "Arlik",          channelId: "UCqx5bz6iJ61SWGySGuWif6A" },
        san:      { name: "san",            channelId: "UCqh-kuEkufTLj_4TD6jBJcA" },
        zein:     { name: "JERC",           channelId: "UC94kuFDI1aGA0S3_ieyDe2A" },
        ruto:     { name: "ruto",           channelId: "UCQLKF38Mt90jCRfEJHaCtIg" },
        xavier:   { name: "xavier",         channelId: "UCfP5DDO3yHmiTyDCaf6CKaw" },
        erlang:   { name: "erlang",         channelId: "UChYf4V1rKht4gPJQkq4a9tg" },
        juka:     { name: "juka",           channelId: "UC7StJFG0KbDpj4vUZhbBcdA" },
        udin:     { name: "udin",           channelId: "UC56gJmS_hgxBCHVjsM-J-sA" },
        mono:     { name: "mono",           channelId: "UCaOGJxIti4JMXdikg_OrDYA" },
        jarot:    { name: "jarot",          channelId: "UCt3CLF7Q8HZKmaP1E7x-ZMQ" },
        keny:     { name: "keny",           channelId: "UCe8i18EVpK3h8nGPgSbwolg" },
        wonka:    { name: "wonka",          channelId: "UCicIVJt17SfJ8LMJ-Ui2fBQ" },
        mocha:    { name: "mocha",          channelId: "UCHcBf8w8yDgyPnRJh32PTJg" }
    };

    let openedActiveStreams = {};
    let currentLiveList = {};
    let extractedVideoIds = {}; 
    let toastTimeout = null;
    let filterOnlyLive = false;
    let globalAudioMuted = true;

    function generateMemberButtons() {
        const container = document.getElementById('memberButtonsContainer');
        if (!container) return;

        container.innerHTML = "";
        const totalMembers = Object.keys(couganMembersData).length;

        const totalLabel = document.getElementById('totalMembersLabel');
        if (totalLabel) totalLabel.innerText = totalMembers;

        for (let memberId in couganMembersData) {
            const member = couganMembersData[memberId];
            const btn = document.createElement('button');
            btn.id = "btn-" + memberId;
            btn.className = "btn btn-mv-toggle btn-inactive";
            btn.onclick = function() { toggleStreamGrid(memberId); };
            btn.innerHTML = `<span class="indicator-dot" id="dot-${memberId}"></span> ${member.name}`;
            container.appendChild(btn);
        }

        checkAllMembersLiveStatus();
    }

    async function checkAllMembersLiveStatus() {
        const promises = [];
        for (let memberId in couganMembersData) {
            const channelId = couganMembersData[memberId].channelId;
            if (!channelId || channelId.trim() === "" || channelId.includes("UC_ID_CHANNEL_YOUTUBE_")) continue;
            promises.push(checkMemberLiveViaBackend(memberId, channelId));
        }
        await Promise.allSettled(promises);
    }

    function showToast(title, desc, isSuccess = false) {
        const toast = document.getElementById('refreshToast');
        const toastTitle = document.getElementById('toastTitle');
        const toastDesc = document.getElementById('toastDesc');
        const toastIcon = document.getElementById('toastStatusIcon');

        toastTitle.innerText = title;
        toastDesc.innerText = desc;

        if (isSuccess) {
            toastIcon.className = "fas fa-check-circle text-success fs-5";
        } else {
            toastIcon.className = "fas fa-sync-alt text-warning fa-spin fs-5";
        }

        toast.classList.add('show');

        if (toastTimeout) clearTimeout(toastTimeout);
        if (isSuccess) {
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    }

    async function manualRefreshLiveStatus() {
        const refreshIcon = document.getElementById('refreshIcon');
        const refreshBtn = document.getElementById('btnRefreshManual');
        
        if (refreshIcon) refreshIcon.classList.add('fa-spin');
        if (refreshBtn) refreshBtn.disabled = true;

        showToast("Pindai Status Live...", "Memeriksa siapa saja member yang sedang LIVE", false);

        await checkAllMembersLiveStatus();

        const liveCount = Object.keys(currentLiveList).length;

        setTimeout(() => {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            if (refreshBtn) refreshBtn.disabled = false;
            showToast("Pindaian Selesai!", `Ditemukan ${liveCount} member sedang LIVE streaming`, true);
        }, 600);
    }

    async function checkMemberLiveViaBackend(memberId, channelId) {
        try {
            const response = await fetch(`/api/check?channelId=${channelId}`);
            const data = await response.json();

            if (data.status === 'success' && data.isLive) {
                // Simpan Video ID jika ada (terutama untuk Ruto / Streamlabs)
                if (data.videoId) {
                    extractedVideoIds[memberId] = data.videoId;
                }
                markLiveStatus(memberId, true);
                return;
            }
        } catch (err) {
            console.warn(`[LIVE-CHECK] ${memberId}: Error fetching status`, err);
        }

        delete extractedVideoIds[memberId];
        markLiveStatus(memberId, false);
    }

    function markLiveStatus(memberId, isLive) {
        const targetDot = document.getElementById("dot-" + memberId);
        if (targetDot) {
            if (isLive) {
                targetDot.classList.add("dot-live-red");
                currentLiveList[memberId] = true;
            } else {
                targetDot.classList.remove("dot-live-red");
                delete currentLiveList[memberId];
            }
        }
        updateActiveScannerCount();
        if (filterOnlyLive) filterChannels();
    }

    function toggleLiveOnlyFilter() {
        const btn = document.getElementById('btnFilterLiveOnly');
        filterOnlyLive = !filterOnlyLive;
        btn.classList.toggle('active', filterOnlyLive);
        filterChannels();
    }

    function filterChannels() {
        const input = document.getElementById('searchChannelInput');
        if (!input) return;
        const filter = input.value.toLowerCase();
        const container = document.getElementById('memberButtonsContainer');
        const buttons = container.getElementsByTagName('button');

        for (let i = 0; i < buttons.length; i++) {
            const memberId = buttons[i].id.replace('btn-', '');
            const btnText = buttons[i].textContent || buttons[i].innerText;
            
            const matchesText = btnText.toLowerCase().indexOf(filter) > -1;
            const matchesLive = filterOnlyLive ? !!currentLiveList[memberId] : true;

            buttons[i].style.display = (matchesText && matchesLive) ? "flex" : "none";
        }
    }

    function toggleAllAudio() {
        globalAudioMuted = !globalAudioMuted;
        const icon = document.getElementById('globalMuteIcon');
        icon.className = globalAudioMuted ? "fas fa-volume-mute text-warning" : "fas fa-volume-up text-success";

        for (let memberId in openedActiveStreams) {
            const iframe = document.querySelector(`#wrapper-video-${memberId} iframe`);
            if (iframe) {
                let src = iframe.src;
                src = globalAudioMuted ? src.replace('mute=0', 'mute=1') : src.replace('mute=1', 'mute=0');
                if (!src.includes('mute=')) src += globalAudioMuted ? '&mute=1' : '&mute=0';
                iframe.src = src;
            }
        }
    }

    function expandFrame(memberId) {
        const frame = document.getElementById(`wrapper-video-${memberId}`);
        if (frame) {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                frame.requestFullscreen().catch(err => console.log(err));
            }
        }
    }

    function updateActiveScannerCount() {
        const activeCountLabel = document.getElementById('activeCountLabel');
        if (!activeCountLabel) return;

        const currentOpenedCount = Object.keys(openedActiveStreams).length;
        if (currentOpenedCount > 0) {
            activeCountLabel.innerText = currentOpenedCount;
            return;
        }

        const totalLiveRedDots = Object.keys(currentLiveList).length;
        activeCountLabel.innerText = totalLiveRedDots;
    }

    function toggleStreamGrid(memberId) {
        const targetBtn = document.getElementById("btn-" + memberId);
        const channelId = couganMembersData[memberId].channelId;

        if (!channelId || channelId.includes("UC_ID_CHANNEL_YOUTUBE_")) {
            alert("ID Channel untuk " + couganMembersData[memberId].name + " belum disetel.");
            return;
        }

        if (!openedActiveStreams[memberId]) {
            openedActiveStreams[memberId] = true;

            if (targetBtn) {
                targetBtn.className = "btn btn-mv-toggle btn-active-mv";
                let isLiveNow = currentLiveList[memberId] ? "dot-live-red" : "";
                targetBtn.innerHTML = `<span class="indicator-dot ${isLiveNow}" id="dot-${memberId}"></span> Sembunyikan: ${couganMembersData[memberId].name}`;
            }

            const gridLayout = document.getElementById('streamDynamicGridLayout');
            const placeholder = document.getElementById('emptyGridPlaceholder');

            const streamContainerCard = document.createElement('div');
            streamContainerCard.id = "wrapper-video-" + memberId;
            streamContainerCard.className = 'col-stream-item transition-all-mv';

            let muteParam = globalAudioMuted ? "mute=1" : "mute=0";

            // PERBAIKAN EMBED STREAMLABS / RUTO:
            // Jika Video ID ter-detect oleh backend, pakai URL /embed/VIDEO_ID
            // Jika tidak, baru fallback ke /embed/live_stream?channel=CHANNEL_ID
            let videoEmbedUrl = "";
            if (extractedVideoIds[memberId]) {
                videoEmbedUrl = `https://www.youtube.com/embed/${extractedVideoIds[memberId]}?autoplay=1&${muteParam}`;
            } else {
                videoEmbedUrl = `https://www.youtube.com/embed/live_stream?channel=${channelId}&autoplay=1&${muteParam}`;
            }

            streamContainerCard.innerHTML = `
                <div class="video-monitor-frame-box d-flex flex-column h-100">
                    <div class="monitor-header-bar d-flex justify-content-between align-items-center">
                        <span class="small fw-bold text-uppercase d-flex align-items-center gap-1" style="letter-spacing: 0.5px;">
                            <i class="fab fa-youtube text-danger me-1"></i> 
                            LIVE MONITOR: <span class="text-warning">${couganMembersData[memberId].name.toUpperCase()} POV</span>
                        </span>
                        <div class="d-flex align-items-center gap-1">
                            <button class="monitor-action-btn" onclick="expandFrame('${memberId}')" title="Fullscreen Monitor"><i class="fas fa-expand"></i></button>
                            <button class="monitor-action-btn close-monitor-x-btn" onclick="closeStreamFrame('${memberId}')" title="Tutup Stream">&times;</button>
                        </div>
                    </div>

                    <div class="ratio ratio-16x9">
                        <iframe src="${videoEmbedUrl}" 
                                title="${memberId} stream POV" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                    </div>
                </div>
            `;

            if (placeholder) placeholder.style.display = 'none';
            gridLayout.appendChild(streamContainerCard);
        } else {
            closeStreamFrame(memberId);
        }

        recalculateGridResponsiveness();
    }

    function closeStreamFrame(memberId) {
        if (openedActiveStreams[memberId]) delete openedActiveStreams[memberId];

        const targetVideoFrame = document.getElementById("wrapper-video-" + memberId);
        if (targetVideoFrame) targetVideoFrame.remove();

        const targetBtn = document.getElementById("btn-" + memberId);
        if (targetBtn) {
            targetBtn.className = "btn btn-mv-toggle btn-inactive";
            let isLiveNow = currentLiveList[memberId] ? "dot-live-red" : "";
            targetBtn.innerHTML = `<span class="indicator-dot ${isLiveNow}" id="dot-${memberId}"></span> ${couganMembersData[memberId].name}`;
        }

        recalculateGridResponsiveness();
    }

    function recalculateGridResponsiveness() {
        const gridLayout = document.getElementById('streamDynamicGridLayout');
        const placeholder = document.getElementById('emptyGridPlaceholder');

        if (!gridLayout) return;

        updateActiveScannerCount();

        const currentActiveCount = Object.keys(openedActiveStreams).length;
        gridLayout.className = "";

        if (currentActiveCount === 0) {
            if (placeholder) placeholder.style.display = 'block';
            return;
        } else {
            if (placeholder) placeholder.style.display = 'none';
            gridLayout.classList.add(`layout-${currentActiveCount}`);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        generateMemberButtons();
    });
    </script>
</body>
</html>
